# Gera de novo o PDF do CV sempre que a página muda.
name: Atualizar PDF do CV

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "photo.jpg"
      - "scripts/make_pdf.py"
  workflow_dispatch:        # permite rodar manualmente pela aba Actions

permissions:
  contents: write           # necessário para salvar o PDF no repositório

jobs:
  pdf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar navegador
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Gerar PDF
        run: python scripts/make_pdf.py index.html pamella-carneiro-cv.pdf

      - name: Salvar PDF no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add pamella-carneiro-cv.pdf
          if git diff --cached --quiet; then
            echo "PDF já está atualizado."
          else
            git commit -m "Atualiza PDF do CV"
            git push
          fi
